name: Market News Intelligence

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Alert slot label'
        required: false
        default: 'manual'
        type: string
  schedule:
    # 08:00, 13:00, 14:00, 15:00 and 20:00 IST (UTC cron)
    - cron: '30 2 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '30 8 * * 1-5'
    - cron: '30 9 * * 1-5'
    - cron: '30 14 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-news-agent
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  GEMINI_MODEL: gemini-3.6-flash
  MAX_GEMINI_REQUESTS_PER_RUN: '3'
  MAX_ALERTS: '10'
  MIN_IMPACT_SCORE: '70'
  MIN_TRADING_RELEVANCE: '65'
  ENABLE_GEMINI: 'true'
  ENABLE_TELEGRAM: 'true'

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check repository secrets (values never printed)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'ERROR: GEMINI_API_KEY is missing'; exit 1; }
          test -n "$TELEGRAM_BOT_TOKEN" || { echo 'ERROR: TELEGRAM_BOT_TOKEN is missing'; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo 'ERROR: TELEGRAM_CHAT_ID is missing'; exit 1; }
          echo 'Required secrets are present.'

      - name: Validate Gemini access without consuming generate quota
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          model = os.environ['GEMINI_MODEL']
          key = os.environ['GEMINI_API_KEY']
          url = f'https://generativelanguage.googleapis.com/v1beta/models/{model}'
          r = requests.get(url, headers={'x-goog-api-key': key}, timeout=30)
          print(f'Gemini metadata HTTP: {r.status_code}')
          if not r.ok:
              print(r.text[:2000])
              raise SystemExit(1)
          data = r.json()
          methods = [x.lower() for x in data.get('supportedGenerationMethods', [])]
          if 'generatecontent' not in methods:
              raise SystemExit(f'generateContent is not supported by {model}: {methods}')
          print(f'Gemini model available: {data.get("name")}')
          print('generateContent: supported')
          PY

      - name: Validate Telegram bot without sending a message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          r = requests.get(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/getMe", timeout=30)
          print(f'Telegram getMe HTTP: {r.status_code}')
          if not r.ok:
              print(r.text[:2000])
              raise SystemExit(1)
          print(f"Telegram bot: @{r.json()['result'].get('username', 'unknown')}")
          PY

      - name: Run market news agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SLOT='${{ inputs.slot }}'
          if [ -z "$SLOT" ]; then SLOT="$(date -u +%H:%M)"; fi
          python -m src.news_agent.main --slot "$SLOT"

      - name: Persist state
        run: |
          if git diff --quiet -- data/state.json; then
            echo 'No state changes.'
            exit 0
          fi
          git config user.name 'market-news-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add data/state.json
          git commit -m 'Update news agent state' || true
          git push
